version: '3.9'

services:
  db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: redis-casino
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:
